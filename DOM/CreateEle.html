<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/remove Element </title>
</head>
<body style="background-color: #212121; color:#fff"> 
    
</body>
<script>
    const div = document.createElement("div");
    div.className = "main"
    div.id=Math.floor(Math.random()*10+1);
    div.setAttribute("title","Create-Element");
    div.style.cssText ="background-color:lightgreen; color:darkgreen; padding:10px; font-size:20px; ";
    // div.innerText = "I am created a new div ele"
    let addText=document.createTextNode("I am created a new div ele")
    div.appendChild(addText)
    console.log(div)
    let body=document.body;
    body.appendChild(div)
</script>
</html>
