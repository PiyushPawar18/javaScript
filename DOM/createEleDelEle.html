<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create and Delete ele</title>
</head>
<body style="background-color: #212121; color:#fff">
    <div class="parent">
        <ul id="ul">
            <li>Html</li>
        </ul>
    </div>
</body>
<script>
    //********************** create ***************************
    function addLang(langName){
        let newLang = document.createElement("li");
        newLang.innerText = langName
        // let parent = document.getElementById("ul");
        // parent.appendChild(newLang);
        document.querySelector('ul').appendChild(newLang);
    }
    addLang("Css")
    addLang("javaScript")
    function addOptilang(langName){
        let li = document.createElement("li");
        li.appendChild(document.createTextNode(langName));
        document.querySelector('ul').appendChild(li)
    }
    addOptilang("reactJS")

    //********************** modify/edit ***************************
    const secondLang = document.querySelector("li:nth-child(2)")
    console.log(secondLang) // <li>Css</li>
    // secondLang.innerHTML = "CSS(Casceding style sheet)"
    const newLang = document.createElement('li')
    newLang.textContent = "CSS(Casceding style sheet)"
    secondLang.replaceWith(newLang)

    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>HTML (hyper text markup lang)</li>"

    //********************** remove ***************************
    const lastLang = document.querySelector("li:last-child");
    // lastLang.remove();
    const parent = lastLang.parentElement;
    console.log(parent) //ul
    console.log(parent.removeChild(lastLang)) //<li>reactJS</li>
    // parent.removeChild(lastLang); 
    
    
    
</script>
</html>
