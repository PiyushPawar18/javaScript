<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-container {
      background: #fff;
      width: 400px;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: 0.3s ease;
    }
    
    .weather-container:hover {
      background-color: transparent;
        
      backdrop-filter: blur(10px);
      transform: translateY(-5px);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #0984e3;
    }

    .search-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f3f6;
      border-radius: 50px;
      padding: 0.4rem 1rem;
      margin-bottom: 1.5rem;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      padding: 0.6rem;
      color: #333;
    }

    .search-box button {
      background: #0984e3;
      border: none;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .search-box button:hover {
      background: #74b9ff;
    }

    .weather-info {
      display: none; /* show this with JS after fetching */
      text-align: center;
    }

    .weather-info img {
      width: 100px;
      margin-bottom: 1rem;
    }

    .temperature {
      font-size: 2.5rem;
      font-weight: 700;
      color: #2d3436;
    }

    .description {
      text-transform: capitalize;
      color: #636e72;
      font-size: 1rem;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 1.5rem;
    }

    .details div {
      background: #f1f3f6;
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      width: 45%;
      color: #0984e3;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="weather-container">
    <div class="title">🌤️ Weather Forecast</div>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name...">
      <button id="search-btn">Search</button>
    </div>

    <div class="weather-info" id="weather-info">
      <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="Weather Icon">
      <div class="temperature">25°C</div>
      <div class="description">Sunny</div>

      <div class="details">
        <div>💨 Wind: 10 km/h</div>
        <div>💧 Humidity: 60%</div>
      </div>
    </div>
  </div>

</body>
</html>
