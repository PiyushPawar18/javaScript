<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0px;
            padding:0px;
        }
        body{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
        }
        .box{
            border-radius: 3px;
            box-shadow: 0px 0px 10px #ffff;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap:5px;
            
        }
        .box h4{
            gap:10px;
            align-self: center;
        }
        .box button{
            background-color: transparent;
            border:none;
            border-radius: 3px;
            padding:3px 5px;
            /* margin-top:5px;
            margin-left:50px; */
        }
        .box button a{
            filter: drop-shadow(2px 2px 10px green);
            text-shadow: 2px 2px 10px white;
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body style="background-color: #212121; color:#fff">
    <div class="box">
        <h4>Go To Count Down Page</h4>
        <button><a href="./countdownTimer.html">Click Me</a></button>
    </div>
</body>
</html>
