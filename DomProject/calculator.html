<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div id="container">
        <div id="ans">
            <h4 id="result">0</h4>
        </div>
        <div id="keys">
            <button id="Ac"  class="btn specialbtn">AC</button>
            <button id="Del" class="btn specialbtn">DEL</button>
            <button id="div" class="btn specialbtn arithMetic">/</button>
            <button id="Mult" class="btn specialbtn arithMetic">*</button>
            <button id="7"  class="btn no">7</button>
            <button id="8" class="btn no">8</button>
            <button id="9" class="btn no">9</button>
            <button id="sub" class="btn specialbtn arithMetic">-</button>
            <button id="6"  class="btn no">6</button>
            <button id="5" class="btn no">5</button>
            <button id="4" class="btn no">4</button>
            <button id="add" class="btn specialbtn arithMetic">+</button>
            <button id="1"  class="btn no">1</button>
            <button id="2" class="btn no">2</button>
            <button id="3" class="btn no">3</button>
            <button id="equal" class="btn rowspan specialbtn">=</button>
            <button id="0" class="btn colspan no">0</button>
            <button id="point" class="btn">.</button>
        </div>
    </div>
</body>
<script src="calculator.js"></script>
</html>
